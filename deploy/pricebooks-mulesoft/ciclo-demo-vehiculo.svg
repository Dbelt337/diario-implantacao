<svg xmlns="http://www.w3.org/2000/svg" width="920" height="978" viewBox="0 0 920 978"><rect x="0" y="0" width="920" height="100%" fill="#FFFFFF"/><text x="460.0" y="44" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#1F3864">Ciclo do veiculo demo / exposicao  -  do estoque ate a venda</text><rect x="160" y="92" width="600" height="60" rx="10" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/><text x="460.0" y="127.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">1. Unidade chega ao estoque fisico</text><rect x="160" y="184" width="600" height="60" rx="10" fill="#E6D5F0" stroke="#7030A0" stroke-width="2"/><text x="460.0" y="219.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">2. Sincroniza para o Salesforce (QuantityOnHand)</text><rect x="160" y="276" width="600" height="60" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="2"/><text x="460.0" y="311.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">3. Cria Vehicle + SerializedProduct + ProductItem</text><rect x="160" y="368" width="600" height="80" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="2"/><text x="460.0" y="403.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">4. Designa como DEMO:  AllocationStatus = Allocated</text><text x="460.0" y="423.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">+ UsageType__c = Demo    -&gt;    BLOQUEADO (nao vendavel)</text><rect x="160" y="480" width="600" height="60" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="2"/><text x="460.0" y="515.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">5. Uso: test drive / exposicao (Scheduler), visao 360</text><rect x="160" y="572" width="600" height="80" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="2"/><text x="460.0" y="607.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">6. Decisao de vender:  AllocationStatus = Deallocated</text><text x="460.0" y="627.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">ConditionType = Antiguo  +  Opportunity no VIN</text><rect x="160" y="684" width="600" height="60" rx="10" fill="#E6D5F0" stroke="#7030A0" stroke-width="2"/><text x="460.0" y="719.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">7. Checagem real-time de disponibilidade no fechamento</text><rect x="160" y="776" width="600" height="60" rx="10" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/><text x="460.0" y="811.0" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14.5" fill="#222">8. Baixa de estoque + faturamento</text><line x1="460.0" y1="152" x2="460.0" y2="176" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,176 466.0,176 460.0,184" fill="#8497B0"/><line x1="460.0" y1="244" x2="460.0" y2="268" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,268 466.0,268 460.0,276" fill="#8497B0"/><line x1="460.0" y1="336" x2="460.0" y2="360" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,360 466.0,360 460.0,368" fill="#8497B0"/><line x1="460.0" y1="448" x2="460.0" y2="472" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,472 466.0,472 460.0,480" fill="#8497B0"/><line x1="460.0" y1="540" x2="460.0" y2="564" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,564 466.0,564 460.0,572" fill="#8497B0"/><line x1="460.0" y1="652" x2="460.0" y2="676" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,676 466.0,676 460.0,684" fill="#8497B0"/><line x1="460.0" y1="744" x2="460.0" y2="768" stroke="#8497B0" stroke-width="2"/><polygon points="454.0,768 466.0,768 460.0,776" fill="#8497B0"/><text x="160" y="876" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1F3864">Responsavel por cada etapa:</text><rect x="160" y="885" width="16" height="16" rx="3" fill="#FCE4D6" stroke="#C55A11" stroke-width="2"/><text x="184" y="898" font-family="Segoe UI,Arial" font-size="13" fill="#222">SAP  -  estoque fisico / recepcao / baixa / faturamento</text><rect x="160" y="909" width="16" height="16" rx="3" fill="#E6D5F0" stroke="#7030A0" stroke-width="2"/><text x="184" y="922" font-family="Segoe UI,Arial" font-size="13" fill="#222">MuleSoft  -  sincronizacao + checagem real-time</text><rect x="160" y="933" width="16" height="16" rx="3" fill="#DDEBF7" stroke="#2E75B6" stroke-width="2"/><text x="184" y="946" font-family="Segoe UI,Arial" font-size="13" fill="#222">Salesforce  -  reserva demo / uso / cotacao / venda</text></svg>