<template>
    <!--
      OmniStudio Standard Runtime: embute o OmniScript pelo componente base padrao
      lightning-omnistudio-omniscript (existe em toda org OmniStudio, sem dependencia
      de componente gerado). Identificacao = type + sub-type + language.
      prefill injeta o Id do Lead (ContextId/leadId) no Data JSON do OmniScript.
    -->
    <lightning-omnistudio-omniscript
        type="LeadListaNegra"
        sub-type="CheckUI"
        language="English"
        prefill={prefill}>
    </lightning-omnistudio-omniscript>
</template>
