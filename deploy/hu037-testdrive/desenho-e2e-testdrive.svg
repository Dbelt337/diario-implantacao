<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a3f6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="920" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3f6b">Test Drive - flujo end to end (HU-037)</text>

  <!-- Banda 1: AGENDAMIENTO -->
  <rect x="20" y="60" width="920" height="220" rx="8" fill="#f2f5f9"/>
  <text x="36" y="86" font-size="13" font-weight="bold" fill="#5b6b7d">1. AGENDAMIENTO (asesor digital o presencial)</text>

  <rect x="50" y="130" width="190" height="70" rx="8" fill="#ffffff" stroke="#1a3f6b" stroke-width="2"/>
  <text x="145" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3f6b">Oportunidad</text>
  <text x="145" y="180" text-anchor="middle" font-size="12" fill="#333">accion "Test Drive"</text>

  <rect x="310" y="115" width="300" height="100" rx="8" fill="#ffffff" stroke="#1a3f6b" stroke-width="2"/>
  <text x="460" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3f6b">OmniScript GQAutoCloudScheduler</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#333">1. valida licencia (IdentityDocument)</text>
  <text x="460" y="178" text-anchor="middle" font-size="12" fill="#333">2. sucursal + horario</text>
  <text x="460" y="196" text-anchor="middle" font-size="12" fill="#333">3. carro demo (Asset) + asesor</text>

  <rect x="680" y="115" width="240" height="100" rx="8" fill="#1a3f6b"/>
  <text x="800" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">SERVICE APPOINTMENT</text>
  <text x="800" y="168" text-anchor="middle" font-size="12" fill="#dfe8f3">reserva oficial de la prueba</text>
  <text x="800" y="186" text-anchor="middle" font-size="12" fill="#dfe8f3">bloquea el VIN del demo</text>
  <text x="800" y="204" text-anchor="middle" font-size="11" fill="#aec6e8">fuente de verdad</text>

  <line x1="240" y1="165" x2="302" y2="165" stroke="#1a3f6b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="165" x2="672" y2="165" stroke="#1a3f6b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Banda 2: AUTOMATICO -->
  <rect x="20" y="300" width="920" height="230" rx="8" fill="#f9f6ef"/>
  <text x="36" y="326" font-size="13" font-weight="bold" fill="#8a7a52">2. AUTOMATICO (plataforma - corre en cualquier canal)</text>

  <rect x="310" y="360" width="300" height="100" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="2"/>
  <text x="460" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">Flow Assigned Resource After Handler</text>
  <text x="460" y="406" text-anchor="middle" font-size="12" fill="#333">estampa en el SA:</text>
  <text x="460" y="424" text-anchor="middle" font-size="12" fill="#333">asesor + vehiculo (marca placa VIN)</text>
  <text x="460" y="442" text-anchor="middle" font-size="12" fill="#333">licencia: la estampa el OmniScript</text>

  <rect x="50" y="370" width="210" height="80" rx="8" fill="#ffffff" stroke="#b08a2e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="155" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f">Modify (estandar)</text>
  <text x="155" y="418" text-anchor="middle" font-size="12" fill="#333">cambio de carro</text>
  <text x="155" y="436" text-anchor="middle" font-size="12" fill="#333">o de horario</text>

  <rect x="680" y="360" width="240" height="110" rx="8" fill="#ffffff" stroke="#7a4b8f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4b8f">Solo con hand-off</text>
  <text x="800" y="406" text-anchor="middle" font-size="12" fill="#333">digital a presencial:</text>
  <text x="800" y="424" text-anchor="middle" font-size="12" fill="#333">Flow crea el Event con sucursal</text>
  <text x="800" y="442" text-anchor="middle" font-size="12" fill="#333">Recibir Cliente (HU-009)</text>
  <text x="800" y="460" text-anchor="middle" font-size="11" fill="#7a4b8f">nunca se crea a mano</text>

  <line x1="800" y1="215" x2="800" y2="352" stroke="#7a4b8f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <path d="M 680 165 L 660 165 L 660 300 L 460 300 L 460 352" fill="none" stroke="#b08a2e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="260" y1="410" x2="302" y2="410" stroke="#b08a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="281" y="398" text-anchor="middle" font-size="10" fill="#8a6d1f">re-estampa</text>

  <!-- Banda 3: DIA DE LA PRUEBA -->
  <rect x="20" y="550" width="920" height="340" rx="8" fill="#eff7f1"/>
  <text x="36" y="576" font-size="13" font-weight="bold" fill="#3e7a52">3. DIA DE LA PRUEBA (guiche / recepcion)</text>

  <rect x="50" y="610" width="270" height="96" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="185" y="636" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">Guiche: imprime la autorizacion</text>
  <text x="185" y="656" text-anchor="middle" font-size="12" fill="#333">PDF con cliente, carro, asesor,</text>
  <text x="185" y="674" text-anchor="middle" font-size="12" fill="#333">sucursal, horario, licencia</text>
  <text x="185" y="692" text-anchor="middle" font-size="11" fill="#2e7d4f">Service Report (o VF segun layout)</text>

  <rect x="380" y="622" width="170" height="70" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="465" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">Cliente firma</text>
  <text x="465" y="670" text-anchor="middle" font-size="12" fill="#333">en fisico</text>

  <rect x="610" y="622" width="150" height="70" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="685" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">Prueba de</text>
  <text x="685" y="668" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">manejo</text>

  <rect x="50" y="760" width="330" height="80" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="215" y="788" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d4f">Cierre en el SA</text>
  <text x="215" y="808" text-anchor="middle" font-size="12" fill="#333">km inicial y final (final obligatorio),</text>
  <text x="215" y="826" text-anchor="middle" font-size="12" fill="#333">condicion del vehiculo, resultado</text>

  <rect x="440" y="760" width="480" height="80" rx="8" fill="#2e7d4f"/>
  <text x="680" y="790" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Odometro del Vehicle actualizado + tarea en la Opp</text>
  <text x="680" y="814" text-anchor="middle" font-size="13" font-weight="bold" fill="#d7efdf">VIN LIBRE para una nueva prueba</text>

  <path d="M 460 460 L 460 500 L 185 500 L 185 602" fill="none" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="658" x2="372" y2="658" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="658" x2="602" y2="658" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 685 692 L 685 730 L 215 730 L 215 752" fill="none" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="800" x2="432" y2="800" stroke="#2e7d4f" stroke-width="2" marker-end="url(#arr)"/>

  <text x="480" y="878" text-anchor="middle" font-size="12" fill="#5b6b7d">El Service Appointment es la fuente de verdad de la prueba; la Oportunidad sigue siendo el proceso comercial.</text>
  <text x="480" y="896" text-anchor="middle" font-size="12" fill="#5b6b7d">Linea punteada = camino opcional. El cambio de carro re-estampa solo: la autorizacion siempre sale con el carro actual.</text>
</svg>
