<template>
    <lightning-modal-header label="Venta guiada — Vehículo nuevo"></lightning-modal-header>
    <lightning-modal-body>
        <div class="modal-body">
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                MOCK de presentación — propuesta de experiencia con datos simulados; los servicios SAP/BRE se conectan por etapa.
            </div>

            <lightning-progress-indicator current-step={currentStep} type="base" variant="base">
                <lightning-progress-step label="Vehículo" value="seleccion"></lightning-progress-step>
                <lightning-progress-step label="Precio y stock" value="precio"></lightning-progress-step>
                <lightning-progress-step label="Cotización" value="cotizacion"></lightning-progress-step>
            </lightning-progress-indicator>

            <div class="slds-p-vertical_medium">
                <template lwc:if={isStepSeleccion}>
                    <lightning-input type="search" label="Buscar vehículo (modelo, versión, VIN)"
                        placeholder="Ej.: Tucson 2026" value={searchTerm}
                        onchange={handleSearchChange} class="slds-m-bottom_small"></lightning-input>
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Modelo / Versión</th>
                                <th scope="col">Año</th>
                                <th scope="col">Color</th>
                                <th scope="col">Precio de lista</th>
                                <th scope="col">Stock Central</th>
                                <th scope="col">Stock Lindora</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={vehicleOptions} for:item="vehicle">
                                <tr key={vehicle.id} class={vehicle.rowClass}
                                    data-id={vehicle.id} onclick={handleSelectVehicle}>
                                    <td>{vehicle.modelo}</td>
                                    <td>{vehicle.anio}</td>
                                    <td>{vehicle.color}</td>
                                    <td>{vehicle.precio}</td>
                                    <td>{vehicle.stockCentral}</td>
                                    <td>{vehicle.stockLindora}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                        Selecciona una fila para continuar. (Real: MaterialSearchService — local, SAP y extensión automática.)
                    </p>
                </template>

                <template lwc:if={isStepPrecio}>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="7" padding="around-small">
                            <div class="slds-box slds-box_small">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Composición del precio de referencia</h3>
                                <template for:each={priceBreakdown} for:item="line">
                                    <div key={line.id} class="slds-grid slds-grid_align-spread slds-p-vertical_xx-small line-row">
                                        <span>{line.concepto}</span>
                                        <span class="slds-text-title_bold">{line.valor}</span>
                                    </div>
                                </template>
                                <div class="slds-grid slds-grid_align-spread slds-p-vertical_x-small total-row">
                                    <span class="slds-text-heading_small">Total de referencia</span>
                                    <span class="slds-text-heading_small">CRC 24.631.000</span>
                                </div>
                            </div>
                        </lightning-layout-item>
                        <lightning-layout-item size="5" padding="around-small">
                            <div class="slds-box slds-box_small">
                                <h3 class="slds-text-heading_small slds-m-bottom_small">Stock en línea (SAP vía MuleSoft)</h3>
                                <p class="slds-p-vertical_xx-small">Sucursal Central: <strong>3 unidades</strong></p>
                                <p class="slds-p-vertical_xx-small">Lindora: <strong>1 unidad</strong></p>
                                <p class="slds-p-vertical_xx-small">Guápiles: <strong>0 unidades</strong></p>
                                <lightning-badge label="Consulta SAP simulada" class="slds-m-top_small"></lightning-badge>
                                <p class="slds-text-body_small slds-m-top_small slds-text-color_weak">
                                    Real: SapInventoryService con Continuation — la pantalla nunca bloquea al asesor.
                                </p>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </template>

                <template lwc:if={isStepCotizacion}>
                    <div class="slds-box slds-box_small">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">Resumen de la cotización</h3>
                        <template for:each={quoteSummary} for:item="line">
                            <div key={line.id} class="slds-grid slds-grid_align-spread slds-p-vertical_xx-small line-row">
                                <span>{line.etiqueta}</span>
                                <span class="slds-text-title_bold">{line.valor}</span>
                            </div>
                        </template>
                        <div class="slds-m-top_medium slds-text-align_center">
                            <lightning-button label="Crear cotización" variant="brand" onclick={handleCreateQuote}></lightning-button>
                        </div>
                        <p class="slds-text-body_small slds-m-top_small slds-text-color_weak">
                            Real: QuoteOrderService crea la cotización nativa; el pedido viaja al SAP en segundo plano y el resultado vuelve por platform event.
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancelar" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
        <lightning-button label="Atrás" onclick={handleBack} disabled={isFirstStep} class="slds-m-right_x-small"></lightning-button>
        <lightning-button label="Siguiente" variant="brand" onclick={handleNext} disabled={nextDisabled}></lightning-button>
    </lightning-modal-footer>
</template>
