<template>
    <lightning-quick-action-panel title="Venta guiada">
        <lightning-progress-indicator current-step={currentStep} type="base" variant="base">
            <lightning-progress-step label="Vehículo / Material" value="seleccion"></lightning-progress-step>
            <lightning-progress-step label="Precio y stock" value="precio"></lightning-progress-step>
            <lightning-progress-step label="Cotización" value="cotizacion"></lightning-progress-step>
        </lightning-progress-indicator>

        <div class="slds-p-vertical_medium">
            <template lwc:if={isStepSeleccion}>
                <template lwc:if={isVentaVehiculo}>
                    <c-venta-vehiculo record-id={recordId}></c-venta-vehiculo>
                </template>
                <template lwc:if={isVentaUsados}>
                    <c-venta-usados record-id={recordId}></c-venta-usados>
                </template>
                <template lwc:if={isContraventaRepuestos}>
                    <c-contraventa-repuestos record-id={recordId}></c-contraventa-repuestos>
                </template>
                <template lwc:if={isVentaPA}>
                    <c-venta-p-a record-id={recordId}></c-venta-p-a>
                </template>
            </template>
            <template lwc:if={isStepPrecio}>
                <!-- TODO: precio y stock del SAP (SapInventoryService, continuation + spinner) -->
                <p class="slds-text-body_regular">Precio y stock (SAP) — en construcción.</p>
            </template>
            <template lwc:if={isStepCotizacion}>
                <!-- TODO: resumen y creación de la cotización (QuoteOrderService) -->
                <p class="slds-text-body_regular">Cotización — en construcción.</p>
            </template>
        </div>

        <div slot="footer" class="slds-text-align_right">
            <lightning-button label="Cancelar" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
            <lightning-button label="Atrás" onclick={handleBack} disabled={isFirstStep} class="slds-m-right_x-small"></lightning-button>
            <lightning-button label="Siguiente" variant="brand" onclick={handleNext} disabled={isLastStep}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
