<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1200" viewBox="0 0 940 1200" font-family="Segoe UI, Arial, sans-serif">
  <rect width="940" height="1200" fill="#ffffff"/>
  <text x="470" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1F3864">HU-039 — Solicitud de Material: LOS DOS TIEMPOS</text>
  <text x="470" y="66" text-anchor="middle" font-size="13" fill="#666">En el momento de la venta todo es automatico (segundos). Lo humano y la creacion en SAP ocurren despues. La venta NUNCA espera.</text>

  <!-- TIEMPO 1 -->
  <rect x="40" y="92" width="860" height="470" rx="14" fill="none" stroke="#70AD47" stroke-width="2.5"/>
  <rect x="60" y="78" width="560" height="28" rx="6" fill="#70AD47"/>
  <text x="72" y="97" font-size="14" font-weight="700" fill="#ffffff">TIEMPO 1 — EN EL MOMENTO DE LA VENTA (segundos, automatico, sin humanos)</text>

  <rect x="80" y="130" width="360" height="52" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#385723">1. Asesor busca el material</text>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#538135">no aparece en el catalogo</text>

  <path d="M260 182 L260 212" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="216" width="360" height="52" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="260" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#385723">2. El sistema verifica en SAP</text>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#538135">MuleSoft, sincrono — el asesor solo ve un spinner</text>

  <path d="M260 268 L260 298" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>
  <text x="270" y="290" font-size="11.5" fill="#888">tres resultados posibles</text>

  <!-- three outcomes -->
  <rect x="60" y="302" width="262" height="96" rx="10" fill="#F2F9EE" stroke="#70AD47" stroke-width="1.3"/>
  <text x="191" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">a. Existe para tu sociedad/centro</text>
  <text x="191" y="344" text-anchor="middle" font-size="11.5" fill="#538135">el catalogo estaba desactualizado:</text>
  <text x="191" y="360" text-anchor="middle" font-size="11.5" fill="#538135">se actualiza solo (upsert) y</text>
  <text x="191" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">LA VENTA SIGUE con el item</text>

  <rect x="339" y="302" width="262" height="96" rx="10" fill="#F2F9EE" stroke="#70AD47" stroke-width="1.3"/>
  <text x="470" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#385723">b. Existe pero sin tu centro</text>
  <text x="470" y="344" text-anchor="middle" font-size="11.5" fill="#538135">EXTENSION AUTOMATICA en SAP</text>
  <text x="470" y="360" text-anchor="middle" font-size="11.5" fill="#538135">(sin humanos, en la misma llamada)</text>
  <text x="470" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">si OK: LA VENTA SIGUE con el item</text>

  <rect x="618" y="302" width="262" height="96" rx="10" fill="#FFF7E6" stroke="#D9A400" stroke-width="1.5"/>
  <text x="749" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7F6000">c. No existe (o fallo la extension)</text>
  <text x="749" y="344" text-anchor="middle" font-size="11.5" fill="#7F6000">nace la SOLICITUD prellenada</text>
  <text x="749" y="360" text-anchor="middle" font-size="11.5" fill="#7F6000">(Product2 RT Solicitud, 10 segundos)</text>
  <text x="749" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#7F6000">LA VENTA SIGUE sin ese item</text>

  <path d="M749 398 L749 428" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="560" y="432" width="340" height="60" rx="10" fill="#FFF7E6" stroke="#D9A400" stroke-width="1.3"/>
  <text x="730" y="455" text-anchor="middle" font-size="12" fill="#7F6000">Si ya habia una solicitud abierta igual:</text>
  <text x="730" y="474" text-anchor="middle" font-size="12" fill="#7F6000">no duplica — el asesor se vincula (Follow) y da seguimiento</text>

  <rect x="80" y="432" width="440" height="60" rx="10" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1.3"/>
  <text x="300" y="455" text-anchor="middle" font-size="12" fill="#555">El asesor avisa al area responsable POR FUERA del sistema</text>
  <text x="300" y="474" text-anchor="middle" font-size="12" fill="#555">(telefono / mensaje — definicion del cliente en la HU)</text>

  <text x="470" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C00000">EL RESTO DE LA COTIZACION Y LA ATENCION AL CLIENTE CONTINUAN NORMALMENTE</text>
  <text x="470" y="550" text-anchor="middle" font-size="12" fill="#C00000">nada del Tiempo 2 bloquea la venta</text>

  <!-- divider -->
  <path d="M470 566 L470 600" stroke="#8C8C8C" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="486" y="590" font-size="12" font-style="italic" fill="#888">horas o dias despues</text>

  <!-- TIEMPO 2 -->
  <rect x="40" y="606" width="860" height="470" rx="14" fill="none" stroke="#2E75B6" stroke-width="2.5"/>
  <rect x="60" y="592" width="620" height="28" rx="6" fill="#2E75B6"/>
  <text x="72" y="611" font-size="14" font-weight="700" fill="#ffffff">TIEMPO 2 — DESPUES DE LA VENTA (dominio Gestion de Productos, con humano)</text>

  <rect x="80" y="644" width="380" height="66" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="270" y="668" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3864">3. El responsable trabaja su list view</text>
  <text x="270" y="686" text-anchor="middle" font-size="11.5" fill="#2E5B8F">Repuesto Original: Equipo de Inventarios</text>
  <text x="270" y="702" text-anchor="middle" font-size="11.5" fill="#2E5B8F">Codigo Comodin: Jefe / Encargado / Almacen</text>

  <path d="M270 710 L270 740" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="744" width="380" height="52" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="270" y="766" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3864">4. Valida y completa los datos</text>
  <text x="270" y="784" text-anchor="middle" font-size="11.5" fill="#2E5B8F">FOB, moneda, origen, marca, codigo de parte...</text>

  <path d="M270 796 L270 826" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="830" width="380" height="52" rx="10" fill="#DDEBF7" stroke="#2E75B6" stroke-width="1.5"/>
  <text x="270" y="852" text-anchor="middle" font-size="13" font-weight="600" fill="#1F3864">5. Aprueba: accion "Enviar a SAP" (en Salesforce)</text>
  <text x="270" y="870" text-anchor="middle" font-size="11.5" fill="#2E5B8F">el humano aprueba; la maquina ejecuta</text>

  <path d="M460 856 L560 856" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="564" y="830" width="336" height="52" rx="10" fill="#EDEDED" stroke="#808080" stroke-width="1.5"/>
  <text x="732" y="852" text-anchor="middle" font-size="13" font-weight="600" fill="#3F3F3F">6. MuleSoft -&gt; SAP ejecuta la creacion</text>
  <text x="732" y="870" text-anchor="middle" font-size="11.5" fill="#595959">SAP = master de materiales (creacion definitiva)</text>

  <path d="M732 882 L732 912" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="564" y="916" width="336" height="66" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="732" y="938" text-anchor="middle" font-size="13" font-weight="600" fill="#385723">7. El MATNR vuelve AL MISMO registro</text>
  <text x="732" y="956" text-anchor="middle" font-size="11.5" fill="#538135">ProductCode = MATNR, se activa:</text>
  <text x="732" y="972" text-anchor="middle" font-size="11.5" fill="#538135">el borrador SE CONVIERTE en el material</text>

  <path d="M564 949 L460 949" stroke="#8C8C8C" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="916" width="380" height="66" rx="10" fill="#E2EFDA" stroke="#70AD47" stroke-width="1.5"/>
  <text x="270" y="938" text-anchor="middle" font-size="13" font-weight="600" fill="#385723">8. El asesor (que sigue el registro) lo ve</text>
  <text x="270" y="956" text-anchor="middle" font-size="11.5" fill="#538135">recontacta al cliente y cotiza el item</text>
  <text x="270" y="972" text-anchor="middle" font-size="11.5" fill="#538135">(en B2B: dentro de la vigencia de la cotizacion)</text>

  <rect x="80" y="1000" width="820" height="56" rx="10" fill="#FBE9E7" stroke="#C00000" stroke-width="1.2"/>
  <text x="490" y="1023" text-anchor="middle" font-size="12" fill="#8B2500">Si SAP falla o no responde (Escenario 6): la solicitud NO se marca creada, la incidencia queda registrada y se reintenta.</text>
  <text x="490" y="1042" text-anchor="middle" font-size="12" fill="#8B2500">Guarda anti-duplicado: el retorno graba el codigo en el MISMO registro — asi el sync del catalogo no crea otro material.</text>

  <!-- footer -->
  <rect x="40" y="1096" width="860" height="66" rx="10" fill="none" stroke="#BFBFBF" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="470" y="1122" text-anchor="middle" font-size="13" font-weight="600" fill="#444">SAP = master de materiales · Salesforce = solicitud, aprobacion y trazabilidad · MuleSoft = ejecuta</text>
  <text x="470" y="1144" text-anchor="middle" font-size="12.5" fill="#666">Tiempo 1 pertenece al flujo de ventas (automatico). Tiempo 2 pertenece a Gestion de Productos (humano + SAP).</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10 z" fill="#8C8C8C"/></marker>
  </defs>
</svg>
